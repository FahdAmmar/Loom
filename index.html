<!doctype html>
<html lang="en">
  <head>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme.
      // Kept in sync with useSettingsStore's persisted "loom-settings" key.
      (function () {
        try {
          var raw = localStorage.getItem("loom-settings");
          var theme = raw ? JSON.parse(raw).state.theme : "system";
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          // If anything goes wrong, fall back to system preference.
          var prefersDarkFallback =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", prefersDarkFallback);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Loom — a calm knowledge workspace weaving structured pages into a living graph of ideas."
    />
    <title>Loom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
